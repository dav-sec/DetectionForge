title: Detección de credenciales en el Registro (indicativo de acceso a credenciales)
id: 0e2a4c6e-9315-4a87-8e0e-4c6e8a0c2e4a
status: experimental
description: >
  Detecta la ejecución de reg.exe con el comando query para acceder a rutas específicas del Registro que almacenan credenciales, lo cual es indicativo de técnicas de acceso a credenciales (T1552.002) y puede preceder a otras técnicas de ataque.
author: DetectionForge Team
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1552/002/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1552.002/T1552.002.md

logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
            - 'WinVNC\Password'
            - 'SNMP'
            - 'DefaultPassword'
            - 'PuTTY\Sessions'
    condition: selection
falsepositives:
    - Prácticamente nulos para estas rutas específicas; a diferencia de T1012, esta regla es de alta confianza
level: high
tags:
    - attack.t1552.002
    - attack.credential-access
detectionforge:
  owner: "dav-sec, Manzur68"
  atomic_test_id: "T1552.002-1"   # Atomic Red Team: Credentials in Registry
  version: "0.1.0"
  siem_targets:
    - splunk
    - elastic
  validation_status: pending 