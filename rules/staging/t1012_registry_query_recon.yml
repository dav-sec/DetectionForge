title: Detección de consultas sospechosas al Registro (indicativo de reconocimiento)
id: 8c0e2a4c-7193-4a85-8c0e-2a4c6e8a0c2e
status: experimental
description: >
  Detecta la ejecución de reg.exe con el comando query, lo cual es indicativo de técnicas de reconocimiento (T1012) y puede preceder a otras técnicas de ataque.
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1012/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1012/T1012.md

logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\reg.exe'
        CommandLine|contains: 'query'
    condition: selection
falsepositives:
    - Es una de las reglas más ruidosas del set; reg query es común en scripts legítimos. Considerar subirla a stable solo combinada con otra señal (ver Mes 5, gestión de falsos positivos)
level: informational
tags:
    - attack.t1012
    - attack.discovery
detectionforge:
  owner: "dav-sec, Manzur68"
  atomic_test_id: "T1012-1"   # Atomic Red Team: Registry Query Recon
  version: "0.1.0"
  siem_targets:
    - splunk
    - elastic
  validation_status: pending 