title: Detección de cuenta agregada a grupo privilegiado
id: 8e0a2c4e-7193-4a85-8e0a-2c4e6a8c0e2a
status: experimental
description: >
  Detecta la adición de una cuenta de usuario a un grupo privilegiado (por ejemplo, Administradores), lo cual es indicativo de técnicas de escalamiento de privilegios (T1098) y persistencia.
author: DetectionForge Team
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1098/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1098/T1098.md

logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'localgroup administrators'
            - '/add'
    condition: selection
falsepositives:
    - Administradores legítimos otorgando acceso elevado documentado a otro usuario
level: high
tags:
    - attack.t1098
    - attack.persistence
detectionforge:
  owner: "dav-sec, Manzur68"
  atomic_test_id: "T1098-1"   # Atomic Red Team: Account Added to Privileged Group
  version: "0.1.0"
  siem_targets:
    - splunk
    - elastic
  validation_status: pending 