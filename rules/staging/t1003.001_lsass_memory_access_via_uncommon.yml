title: LSASS Memory Access via Uncommon Process
id: f156d9bc-8eb4-4064-b5a4-9f57f689d996
status: experimental
description: >
  Detecta el acceso a la memoria de LSASS por procesos que no son típicamente asociados
  con la administración de credenciales, lo que puede indicar intentos de robo de
  credenciales o volcado de memoria.
author: DetectionForge Team
date: 2026-10-31
references:
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1003.001/T1003.001.md
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: \lsass.exe
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
  filter:
    SourceImage|endswith:
      - \wmiprvse.exe
      - \svchost.exe
  condition: selection and not filter
falsepositives:
  - Soluciones EDR/antivirus legítimas que inspeccionan LSASS por diseño
level: high
tags:
  - attack.t1003.001
  - attack.credential-access
detectionforge:
  owner: dav-sec, Manzur68
  atomic_test_id: T1003.001-1
  version: 0.1.0
  siem_targets:
    - splunk
    - elastic
  validation_status: pending
