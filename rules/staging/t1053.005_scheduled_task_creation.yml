title: Tarea programada creada mediante schtasks.exe
id: 7e4f1a2c-9b3d-4a5e-8f1c-2a4b6c8d0e1f
status: experimental
description: >
  Detecta la creación de nuevas tareas programadas mediante el comando schtasks.exe,
  una técnica común utilizada por malware para persistir en el sistema y ejecutar
  código malicioso en momentos específicos o tras reinicios.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1053.005/T1053.005.md
author: DetectionForge Team
date: 2026-10-06

logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/create'
    filter:
        CommandLine|contains: 'Microsoft\Windows\UpdateOrchestrator'
    condition: selection and not filter
falsepositives:
    - Instaladores legítimos de software que registran tareas programadas de actualización
    - Scripts de administración del equipo de TI que gestionan tareas programadas
level: medium

tags:
    - attack.t1053.005
    - attack.persistence
    - attack.execution

detectionforge:
  owner: "dav-sec, Manzur68"
  atomic_test_id: "T1053.005-1"   # Atomic Red Team: Scheduled Task Creation
  version: "0.1.0"
  siem_targets:
    - splunk
    - elastic
  validation_status: pending 