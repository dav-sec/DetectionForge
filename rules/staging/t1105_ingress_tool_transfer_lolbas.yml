title: Descarga de archivo sospechoso mediante certutil o bitsadmin
id: 2e4a6c8d-1537-4a89-8c2e-4a6c8d0e2a4c
status: experimental
description: 
  Detecta la descarga de un archivo mediante certutil.exe con los parámetros -urlcache y -decode,
  o mediante bitsadmin.exe con el parámetro /transfer, técnicas que pueden ser usadas por adversarios
  para transferir herramientas o payloads maliciosos (T1105).
author: DetectionForge Team
date: 2026-10-06
references:
    - https://attack.mitre.org/techniques/T1105/
    - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1105/T1105.md

logsource:
    category: process_creation
    product: windows
detection:
    selection_certutil:
        Image|endswith: '\certutil.exe'
        CommandLine|contains:
            - '-urlcache'
            - '-decode'
    selection_bitsadmin:
        Image|endswith: '\bitsadmin.exe'
        CommandLine|contains: '/transfer'
    condition: selection_certutil or selection_bitsadmin
falsepositives:
    - Uso administrativo legítimo de certutil para gestión de certificados (poco común con estos flags específicos)
level: medium
tags:
    - attack.t1105
    - attack.command-and-control
detectionforge:
  owner: "dav-sec, Manzur68"
  atomic_test_id: "T1105-1"   # Atomic Red Team: Ingress Tool Transfer via LOLBAS
  version: "0.1.0"
  siem_targets:
    - splunk
    - elastic
  validation_status: pending 